name: Mac harnesses

on:
  push:
    branches: [main, ci/harness]
    paths: ['tweak/**', 'harness/**', 'vendor/**', 'scripts/harness-plan.py', '.github/**']
  pull_request:
    paths: ['tweak/**', 'harness/**', 'vendor/**', 'scripts/harness-plan.py', '.github/**']
  workflow_dispatch:
  schedule:
    # Weekly full run; scheduled events have no changed-file list.
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select harnesses
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          ZERO: '0000000000000000000000000000000000000000'
        run: |
          set -u
          changed=$(mktemp)
          mode=diff
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$EVENT_NAME" = schedule ]; then
            mode=all
          elif [ "$EVENT_NAME" = pull_request ]; then
            git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
            if ! git diff --no-renames --name-only "origin/$BASE_REF...$SHA" > "$changed"; then
              echo "pull request diff failed; running everything" >&2
              mode=all
            fi
          elif [ "$EVENT_NAME" = push ]; then
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "no usable before commit; running everything" >&2
              mode=all
            elif ! git merge-base --is-ancestor "$BEFORE" "$SHA" 2>/dev/null; then
              echo "before is not an ancestor (force push); running everything" >&2
              mode=all
            elif ! git diff --no-renames --name-only "$BEFORE" "$SHA" > "$changed"; then
              echo "push diff failed; running everything" >&2
              mode=all
            fi
          else
            mode=all
          fi
          if [ "$mode" = all ]; then
            python3 scripts/harness-plan.py plan --all --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/harness-plan.py plan --changed-from "$changed" --github-output "$GITHUB_OUTPUT"
          fi

  harness:
    name: Harnesses ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Theos for Logos hooks only
        if: matrix.theos
        uses: ./.github/actions/setup-theos
      - name: Build and assert
        shell: bash
        env:
          THEOS: ${{ github.workspace }}/theos
        run: python3 scripts/harness-plan.py run --shard "${{ matrix.shard }}" --names "${{ matrix.harnesses }}"
